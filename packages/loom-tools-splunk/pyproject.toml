[project]
name = "loom-tools-splunk"
version = "0.1.0"
description = "Splunk search for loom's code mode"
requires-python = ">=3.12"
dependencies = ["loom", "splunk-sdk>=2.1"]

[project.entry-points."loom.tools"]
splunk = "loom_tools_splunk:package"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_tools_splunk"]
