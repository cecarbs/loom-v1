[project]
name = "loom"
dynamic = ["version"]
description = "Terminal agent harness with a sandboxed, persistent code-mode kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "openai>=3.41.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.9",
    "rich>=15.0.0",
    "keyring>=25.7",
    "pyyaml>=6.0",
]

[project.scripts]
loom = "loom.cli:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]

[dependency-groups]
dev = [
    "loom-tools-demo",
    "loom-tools-splunk",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
loom = { workspace = true }
loom-tools-demo = { workspace = true }
loom-tools-splunk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/loom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # doc snippets are intentionally compact

[tool.ruff.per-file-target-version]
"src/loom/kernel/runner.py" = "py311"  # runs inside the sandbox on any Python >= 3.11

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src", "tests", "packages"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "macos: needs macOS sandbox-exec",
    "docker: needs a running Docker daemon",
]
